extends: constrained_fm/configs/baseline.yaml

name: siren-gmmq05
description: >
  Reverts the encoder to the checkpoint used by the 2026-08-10 notebook run, which scored
  SR median 95.92 / SWD 0.1113 / JSD 0.0106 against the current baseline's 90.89 / 0.1927 /
  0.0268 at identical mass IoU. Changes only the SIREN weights and the query fraction they
  were meta-trained with; every other field is inherited. Restore the checkpoint with:
  git cat-file -p 3007ed9:constrained_fm/functa_dataset/siren_best.pt
  > constrained_fm/functa_dataset/siren_gmmq05.pt   (sha256 8d02273354)

siren:
  checkpoint: constrained_fm/functa_dataset/siren_gmmq05.pt

extraction:
  query_gmm_fraction: 0.5
