extends: constrained_fm/configs/baseline.yaml

name: siren-uniform
description: >
  Swaps in the older encoder siren_uniform.pt (2026-08-01, epoch 700, meta val_mse 0.00346),
  which was meta-trained before the GMM-query option existed and therefore used purely
  uniform query points. Its query fraction is set to 0.0 to match that training, exactly as
  baseline uses 0.5 to match siren_gmmq05.pt. Never evaluated downstream despite having the
  best meta-validation MSE of any checkpoint. Restore it with:
  git cat-file -p efa8cab:constrained_fm/functa_dataset/siren_best.pt
  > constrained_fm/functa_dataset/siren_uniform.pt   (sha256 abe5b220b8)

siren:
  checkpoint: constrained_fm/functa_dataset/siren_uniform.pt

extraction:
  query_gmm_fraction: 0.0
