name: no-siren-feature
description: 'Ablation of the auxiliary pointwise input SIREN(x_t, z), NOT of the
  conditioning itself: z is still concatenated into the input and still drives the
  AdaGN modulation, so the model stays fully Functa-conditioned. With mass IoU averaging
  0.85 and collapsing on the tail, that extra per-point boundary feature may be actively
  misleading the vector field exactly where the decoded region is wrong.

  '
degree: 3
scale: 4.5
siren:
  checkpoint: constrained_fm/functa_dataset/siren_best.pt
  latent_dim: 512
  hidden_dim: 512
  n_layers: 4
  w0: 30.0
extraction:
  points_per_shape: 1000
  steps: 15
  lr: 0.01
  query_gmm_fraction: 0.0
pool:
  size: 100000
  chunk_size: 128
  min_area: 0.05
  max_area: 0.95
fm:
  hidden_dim: 1024
  num_blocks: 4
  time_emb_dim: 128
  use_siren_feature: false
train:
  iterations: 15001
  batch_size: 1024
  lr: 0.001
  lr_min: 1.0e-05
  mass_weight_power: 0.0
  max_weight: 20.0
  seed: 0
  log_every: 500
  checkpoint_every: 2500
evaluation:
  num_polys: 100
  num_x0: 10000
  step_size: 0.05
  gmm_pool_size: 100000
  iou_grid_size: 200
  iou_mass_samples: 20000
  likelihood_grid: 200
  num_vis_samples: 50000
  num_worst_plots: 4
  seed: 0
